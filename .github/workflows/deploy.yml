name: Deploy to Google + Telegram report

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Make CI scripts executable
        run: chmod +x .ci/*.sh .ci/*.py
        
      - name: Run tests
        run: |
          echo "🧪 Running tests before deploy..."
          node tests/run.js
          echo "✓ All tests passed — safe to deploy"

      # ── المرحلة 1: الاعتماد ──
      - name: Auth — access token from clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: .ci/auth.sh

      # ── المرحلة 2: بناء الـ payload ──
      - name: Build payload from repo files
        run: |
          COUNT=$(python3 .ci/build-payload.py)
          echo "→ Payload جاهز: $COUNT ملف"

      # ── المرحلة 3: الرفع ──
      - name: Push to Google (direct API)
        run: .ci/push.sh

      # ── المرحلة 4: التحقق ──
      - name: Verify Google received exact code
        run: .ci/verify.sh

      # ── المرحلة 5: فحص البوت ──
      - name: Telegram health check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          ME=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe")
          echo "$ME" | grep -q '"ok":true' || { echo "::error::getMe فشل: $ME"; exit 1; }
          echo "BOT_NAME=$(echo "$ME" | grep -o '"username":"[^"]*"' | head -1 | cut -d'"' -f4)" >> "$GITHUB_ENV"
          echo "✓ البوت حي"

      # ── المرحلة 6: معلومات الـ commit ──
      - name: Extract commit info
        run: |
          echo "COMMIT_MSG=$(git log -1 --pretty=%s | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(grep -oE 'VERSION:[[:space:]]*[0-9]+' Config.js | head -1 | grep -oE '[0-9]+')" >> "$GITHUB_ENV"
      # ── المرحلة 7: التقرير ──
      - name: Notify — success report
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: .ci/notify.sh success

      - name: Notify — failure alert
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: .ci/notify.sh failure